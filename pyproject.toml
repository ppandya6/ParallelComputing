[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-scientific-computing"
version = "0.1.0"
description = "Reproducible heat-diffusion simulations and multiprocessing benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
parallel-science = "parallel_science.cli:main"

[tool.setuptools.packages.find]
include = ["parallel_science*"]
